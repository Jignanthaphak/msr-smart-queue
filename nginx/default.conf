# FILE: nginx/default.conf

# upstream ชี้ไปที่ service "web" ใน docker-compose.yml
upstream msrecord_app {
    server web:3000;
}

server {
    # image nginx-unprivileged ใช้ 8080 ภายใน container
    listen 8080;
    server_name _;

    # ซ่อน version ของ nginx
    server_tokens off;

    # จำกัดขนาด request body ป้องกัน upload ใหญ่เกินจำเป็น
    client_max_body_size 10M;

    # Security Headers พื้นฐาน
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # สามารถเพิ่ม Content-Security-Policy ได้ แต่ต้องทดสอบกับระบบจริงก่อน
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    # ========== SSE: /api/monitor ==========
    # ตรงนี้คือ endpoint SSE โดยเฉพาะ
    location /api/monitor {
        proxy_pass         http://msrecord_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ปิด WebSocket upgrade สำหรับ SSE (ไม่จำเป็น และบางทีทำให้แปลก)
        proxy_set_header Upgrade           "";
        proxy_set_header Connection        "";

        # สำคัญสำหรับ SSE: ไม่ให้ nginx buffer / cache response
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # ปล่อยให้ connection ค้างได้นาน ๆ
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ป้องกัน cache ฝั่ง client ด้วย
        add_header Cache-Control "no-cache";
    }

    # ========== เส้นทางอื่น ๆ ==========
    location / {
        proxy_pass         http://msrecord_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # สำหรับ WebSocket (ถ้ามีใช้อยู่)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # ซ่อน header บางอย่างจาก upstream ถ้ามี
        proxy_hide_header X-Powered-By;
    }
}
