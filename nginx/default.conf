# FILE: nginx/default.conf

# upstream ชี้ไปที่ service "web" ใน docker-compose.yml พร้อม keepalive connections
upstream msrecord_app {
    server web:3000;
    keepalive 32;
}

server {
    # image nginx-unprivileged ใช้ 8080 ภายใน container
    listen 8080;
    server_name _;

    # ซ่อน version ของ nginx
    server_tokens off;

    # จำกัดขนาด request body ป้องกัน upload ใหญ่เกินจำเป็น
    client_max_body_size 10M;

    # Gzip Compression: บีบอัดไฟล์ JSON, JS, CSS ลดขนาดลง 70-85% ทำให้โหลดหน้าเว็บและ default-data เร็วขึ้นอย่างมาก
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers พื้นฐาน
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========== Next.js Static Assets Caching ==========
    location ~* ^/(msr/)?_next/static/ {
        proxy_pass         http://msrecord_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000, immutable";
        access_log         off;
    }

    # ========== SSE: /api/monitor (รวมถึง /msr/api/monitor ตาม basePath) ==========
    # ตรงนี้คือ endpoint SSE โดยเฉพาะ ให้ส่งข้อมูลแบบเรียลไทม์ทันทีโดยไม่หน่วง
    location ~* ^/(msr/)?api/monitor {
        proxy_pass         http://msrecord_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ปิด WebSocket upgrade สำหรับ SSE
        proxy_set_header Upgrade           "";
        proxy_set_header Connection        "";

        # สำคัญสำหรับ SSE: ปิด buffer / cache และเปิด tcp_nodelay ส่งข้อมูลทันที
        proxy_buffering off;
        proxy_cache off;
        tcp_nodelay on;
        add_header X-Accel-Buffering no;

        # ปล่อยให้ connection ค้างได้นาน ๆ
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ป้องกัน cache ฝั่ง client ด้วย
        add_header Cache-Control "no-cache";
    }

    # ========== เส้นทางอื่น ๆ ==========
    location / {
        proxy_pass         http://msrecord_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # สำหรับ WebSocket (ถ้ามีใช้อยู่)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Proxy Buffers ใน RAM เพื่อไม่ให้เขียนลงดิสก์ชั่วคราว (เช่น default-data ขนาด 800KB+)
        proxy_buffer_size          128k;
        proxy_buffers              8 256k;
        proxy_busy_buffers_size    256k;

        # ซ่อน header บางอย่างจาก upstream ถ้ามี
        proxy_hide_header X-Powered-By;
    }
}
