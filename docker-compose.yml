# FILE: docker-compose.yml
version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: msrecord_db
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      # *** เปลี่ยนค่าเหล่านี้เป็นค่าจริงก่อนใช้งาน ***
      MYSQL_ROOT_PASSWORD: change_root_password_here
      MYSQL_DATABASE: jigwork
      MYSQL_USER: msrecord_app
      MYSQL_PASSWORD: msrecord_app@2025
      TZ: Asia/Bangkok
    volumes:
      - db_data:/var/lib/mysql
      # ถ้าต้องการให้ import โครงสร้าง DB อัตโนมัติจากไฟล์ db_schema.sql
      # ให้ uncomment บรรทัดด้านล่าง และให้มีไฟล์ db_schema.sql อยู่ที่ root โปรเจค
      - ./db_schema.sql:/docker-entrypoint-initdb.d/db_schema.sql:ro
    networks:
      - msrecord_net
      # ไม่เปิด port 3306 ออกนอก container เพื่อความปลอดภัย
      # ถ้าจำเป็นต้องต่อ DB จากภายนอกจริง ๆ ให้เพิ่ม ports: "3306:3306" เองภายหลัง
    ports:
      - "3307:3306"

  web:
    build: .
    container_name: msrecord_web
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.docker
    networks:
      - msrecord_net
    # เปิด 3000 ออกไว้เพื่อ debug/ตรวจสอบได้จาก LAN
    # ถ้าอยากล็อกมากขึ้นสามารถลบส่วน ports นี้ออก แล้วเข้าผ่าน nginx อย่างเดียว
    ports:
      - "3000:3000"

  nginx:
    # ใช้ image nginx แบบรันด้วย user ที่ไม่ใช่ root และใช้ port 8080 ใน container
    image: nginxinc/nginx-unprivileged:stable
    container_name: msrecord_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # map port 80 ของ host -> 8080 ใน container (เพราะ container นี้ไม่ได้รันเป็น root)
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - msrecord_net

networks:
  msrecord_net:
    driver: bridge

volumes:
  db_data:
